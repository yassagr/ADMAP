[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admap-m3"
version = "1.0.0"
description = "ADMAP M3 — YARA Signature Generator microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0,<0.49.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "click>=8.1.0",
    "yara-python>=4.5.0",
    "pefile>=2023.2.7",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
admap-m3 = "admap_m3.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=admap_m3 --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["admap_m3"]
omit = ["tests/*"]
