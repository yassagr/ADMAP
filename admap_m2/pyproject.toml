[project]
name = "admap_m2"
version = "1.0.0"
description = "ADMAP M2 - C2 Detector Platform"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "dpkt>=1.9.8",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "click>=8.1.7",
    "python-multipart>=0.0.9",
    "stix2>=3.0.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
geoip = ["geoip2>=4.8.0"]
pyshark = ["pyshark>=0.6"]

[project.scripts]
admap-m2 = "admap_m2.cli.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
